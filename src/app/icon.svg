<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-12 h-12">
  <defs>
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE18D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997312" />
    </linearGradient>
  </defs>

  <!-- قرارگیری در مرکز -->
  <g transform="translate(15, 15)">
    <!-- بدنه اصلی حرف V -->
    <path d="M 10,0 L 35,60 L 20,60 L 0,10 Z" fill="url(#premiumGold)" opacity="0.8"/>
    <path d="M 60,0 L 35,60 L 50,60 L 70,10 Z" fill="url(#premiumGold)"/>

    <!-- خطوط نمادین بخار (Vapor) -->
    <path d="M 35,45 C 10,25 25,-5 35,-15" fill="none" stroke="url(#premiumGold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 45,35 C 65,15 50,-5 45,-10" fill="none" stroke="url(#premiumGold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
